<style id="munawar-universal-type-v3">
/* ONE typography standard across every Munawar.in page — 2026-09-03 */
:root{--reading-size:16px;--support-size:15px;--meta-size:13px;--control-size:15px}
html{-webkit-text-size-adjust:100%}body{font-size:17px!important}
p,li,dd,.body-copy,.content-copy{font-size:var(--reading-size)!important;line-height:1.72!important}
input,select,textarea,button{font-size:var(--control-size)!important;line-height:1.45}
label,.form-group label,.tool-form label{font-size:13.5px!important;line-height:1.45!important}
.nav-links a,.nav-top{font-size:14.5px!important}.nav-dropdown strong{font-size:13.5px!important}.nav-dropdown small{font-size:12.5px!important;line-height:1.42!important}.nav-cta{font-size:13.5px!important}
.eyebrow,.section-label,.article-meta,.cat b,.tags span,.filter-btn,.article-filter,.source-link,.type,.num,.stepno,.panel-chip{font-size:12.5px!important}
.hero p,.knowledge-hero p,.article-hero p,.section-head p,.hero-panel p,.purpose-card p,.final-cta p{font-size:17px!important;line-height:1.72!important}
.k-card p,.ai-card p,.article-card p,.article-card-new p,.story-card p,.guide-card p,.guide-card li,.detail-block p,.detail-block li,.doc-card p,.acc-content,.insight-body,.insight-content,.qa-answer,.law-content{font-size:16px!important;line-height:1.72!important}
.takeaway,.article-card .takeaway,.insight-takeaway,.note,.info-note,.helper,.muted,.global-search-helper{font-size:14.5px!important;line-height:1.62!important}
.metric span,.float-card small,.float-card i,.tool-list span,.footer-grid p,.footer-grid a{font-size:13.5px!important;line-height:1.65!important}
.footer-grid strong,.footer-bottom{font-size:12.5px!important}
@media(max-width:768px){body{font-size:16px!important}p,li,dd,.body-copy,.content-copy,.hero p,.knowledge-hero p,.article-hero p,.section-head p,.hero-panel p,.k-card p,.ai-card p,.article-card p,.article-card-new p,.story-card p,.guide-card p,.guide-card li,.detail-block p,.detail-block li,.doc-card p,.acc-content{font-size:16px!important;line-height:1.7!important}input,select,textarea,button{font-size:16px!important}.nav-links a,.nav-top{font-size:15px!important}}
</style>
</head>
