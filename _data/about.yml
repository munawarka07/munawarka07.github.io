page:
  eyebrow: ABOUT THE PERSON BEHIND THE PLATFORM
  hero_title: People operations with purpose & structure.
  hero_description_1: My professional journey has developed across payroll, HR operations, employee services and process improvement
    - building practical experience around the systems and decisions that keep people operations moving.
  hero_description_2: I believe good HR is not only about policy and process. It is about creating clarity, maintaining trust
    and making complex employee matters easier for people and organizations to navigate.
  profile_chips:
  - HR Operations
  - Payroll
  - People & Process
  marquee:
  - HR OPERATIONS
  - PAYROLL
  - EMPLOYEE SERVICES
  - PROCESS IMPROVEMENT
  - PEOPLE FIRST
  - COMPLIANCE
  facts_label: 01 / QUICK FACTS
  facts_title: Experience behind the knowledge.
  facts_description: A concise view of the areas that have shaped my professional experience and the perspective behind munawar.in.
  approach_label: 02 / MY APPROACH
  approach_title: HR works best when clarity meets empathy.
  approach_paragraphs:
  - My career began with payroll and finance foundations and gradually expanded into broader HR operations, employee lifecycle
    management, compliance, employee relations and people services.
  - 'That journey shaped how I approach HR today: understand the detail, simplify the process, communicate clearly and keep
    the human experience in view.'
  mvv_label: 03 / MISSION • VISION • VALUES
  mvv_title: What guides the platform.
  mvv_description: Munawar.in exists to make practical HR knowledge clearer, more useful and easier to access.
