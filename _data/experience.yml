  - heading: Operational Foundation
    points:
    - Built practical expertise in payroll accuracy, confidentiality and employee pay processes.
    - Developed strong numerical and control-oriented habits that later supported broader HR work.
    - Worked closely with HR and Finance stakeholders on recurring employee-payment activities.
