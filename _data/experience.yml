roles:
- period: 2025 - Present
  company: IMKAN PROPERTIES • ABU DHABI
  title: Payroll Specialist
  summary: Payroll operations, attendance controls, employee pay-related processes, reporting and coordination across HR and
    related stakeholders.
  tags:
  - Payroll
  - Attendance
  - Controls
  - HR Operations
  detail_blocks:
  - heading: Payroll Operations
    points:
    - Manage monthly payroll inputs, attendance and employee pay-related changes.
    - Review payroll data for accuracy, exceptions and required approvals.
    - Support salary processing, deductions, allowances and employee payment controls.
  - heading: Attendance & Controls
    points:
    - Review attendance irregularities, leave impacts and payroll cut-off requirements.
    - Coordinate corrections and supporting documentation with relevant stakeholders.
    - Maintain structured controls around payroll inputs and monthly reporting.
  - heading: Employee Support
    points:
    - Respond to payroll-related employee queries and payment clarifications.
    - Coordinate salary adjustments, recoveries and supporting documentation.
    - Support accurate employee records used for payroll and HR operations.
  - heading: Reporting & Coordination
    points:
    - Prepare payroll and attendance summaries for HR and management review.
    - Coordinate with HR, Finance and other teams on payroll-sensitive updates.
    - Support process improvements and reporting clarity across recurring payroll activities.
  impact_tags:
  - Payroll Specialist
  - Attendance Controls
  - Reporting
  - Employee Queries
  published: true
