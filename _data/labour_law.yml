sections:
  - published: true
    id: labour-law-objectives
    category: Getting Hired
    search: objectives purpose labour law employment rights employer worker labour
      market
    title: Labour Law Objectives
    reference: Article 2
    content: The Labour Relations Law aims to support an efficient and attractive
      labour market, develop workforce capabilities, regulate employment
      relationships and protect the rights of both employers and workers.
  - published: true
    id: equality-non-discrimination
    category: Getting Hired
    search: equality discrimination equal opportunity equal pay race colour sex
      religion nationality disability
    title: Equality & Non-Discrimination
    reference: Article 4
    content: Discrimination that undermines equal opportunity or equal treatment in
      employment is prohibited on specified grounds. Women are entitled to equal
      pay for the same work or work of equal value.
  - published: true
    id: recruitment-work-permits
    category: Getting Hired
    search: recruitment work permit hiring employment recruitment fees permit
    title: Recruitment & Work Permits
    reference: Article 6
    content: Work may not be performed, and a worker may not be recruited or
      employed, without the required Ministry work permit. Employers may not
      charge workers recruitment or employment costs directly or indirectly.
  - published: true
    id: employment-contract
    category: Getting Hired
    search: employment contract work contract terms job offer agreement
    title: Employment Contract
    reference: Article 8
    content: The employer and worker must enter into an employment contract in
      accordance with the prescribed form and rules. Additional terms may be
      included provided they do not conflict with the law and its Executive
      Regulation.
  - id: probation-period
    category: Getting Hired
    search: probation contract hiring probation period
    title: Probation Period
    reference: Article 9
    content: Probation may not exceed six months. If an employer terminates during
      probation, written notice of at least 14 days is required.
    published: true
  - published: true
    id: non-competition-clause
    category: Employment Ending
    search: non compete non competition competitor business secrets clients
      resignation restriction
    title: Non-Competition Clause
    reference: Article 10
    content: Where a worker has access to clients or business secrets, a non-compete
      restriction may be agreed if it is appropriately limited by time, place
      and type of work. The restriction may not exceed two years after the
      employment contract ends.
  - published: true
    id: employer-obligations
    category: Getting Hired
    search: employer obligations records documents safety training employee rights
      workplace
    title: Employer Obligations
    reference: Article 13
    content: Employers have statutory duties covering matters such as employee
      records, official documents, workplace requirements, occupational safety,
      employee awareness of rights and obligations, medical care and other
      employment requirements.
  - id: normal-working-hours
    category: Working Time & Pay
    search: hours overtime ramadan normal working hours
    title: Normal Working Hours
    reference: Article 17
    content: The general statutory limit is eight hours per day or 48 hours per
      week, subject to exceptions and the Executive Regulation.
    published: true
  - id: ramadan-working-hours
    category: Working Time & Pay
    search: ramadan hours ramadan working hours
    title: Ramadan Working Hours
    reference: Executive Regulation
    content: Normal working hours are reduced by two hours during Ramadan under the
      Executive Regulation.
    published: true
  - published: true
    id: overtime
    category: Working Time & Pay
    search: overtime extra hours additional hours overtime pay working hours
    title: Overtime
    reference: Article 19
    content: An employer may require overtime within the statutory limits, generally
      not exceeding two additional hours per day except where otherwise
      permitted. Eligible overtime must be compensated according to the rules
      prescribed by law.
  - id: total-wage-deductions
    category: Salary & Deductions
    search: deduction salary 50 total wage deductions
    title: Total Wage Deductions
    reference: Article 25
    content: Where there are multiple lawful reasons for deductions, the total
      deduction may not exceed 50% of the wage.
    published: true
  - published: true
    id: public-holidays
    category: Leave & Time Off
    search: public holiday official holiday holiday pay work holiday substitute day
    title: Public Holidays
    reference: Article 28
    content: Workers are entitled to official public holidays with full pay. If work
      is required on a public holiday, the employer must provide another rest
      day or the additional compensation prescribed by law.
  - id: annual-leave
    category: Leave & Time Off
    search: annual leave 30 days annual leave
    title: Annual Leave
    reference: Article 29
    content: Employees are entitled to at least 30 days of annual leave for each
      year of extended service. Additional rules apply for service below one
      year.
    published: true
  - id: maternity-leave
    category: Leave & Time Off
    search: maternity leave maternity leave
    title: Maternity Leave
    reference: Article 30
    content: The Labour Relations Law provides statutory maternity leave and related
      protections. Conditions and additional leave situations should be checked
      against the current text.
    published: true
  - published: true
    id: sick-leave
    category: Leave & Time Off
    search: sick leave illness medical leave 90 days full pay half pay probation
    title: Sick Leave
    reference: Article 31
    content: After probation, a worker may be entitled to up to 90 days of sick
      leave per year, subject to statutory conditions and the applicable pay
      structure. Notification and medical-evidence requirements also apply.
  - published: true
    id: other-statutory-leave
    category: Leave & Time Off
    search: bereavement parental study leave compassionate leave national service
    title: Bereavement, Parental & Study Leave
    reference: Article 32
    content: The law provides additional statutory leave for specified circumstances
      including bereavement, parental leave and qualifying study leave. UAE
      nationals may also be entitled to national-service leave under applicable
      legislation.
  - published: true
    id: disciplinary-sanctions
    category: Employment Ending
    search: disciplinary sanctions warning wage deduction suspension misconduct penalty
    title: Disciplinary Sanctions
    reference: Article 39
    content: The law specifies disciplinary sanctions that may be imposed for
      workplace violations, ranging from written caution or warning to other
      permitted measures, subject to applicable procedures and statutory limits.
  - published: true
    id: disciplinary-action-rules
    category: Employment Ending
    search: disciplinary action sanctions investigation misconduct workplace violation
    title: Rules for Disciplinary Action
    reference: Article 41
    content: Disciplinary action is subject to statutory safeguards. A sanction
      generally may not be imposed for conduct outside the workplace unless it
      is connected to work, and more than one disciplinary sanction may not be
      imposed for the same violation.
  - published: true
    id: employment-contract-ending
    category: Employment Ending
    search: contract ending termination expiry mutual agreement death disability
      closure
    title: When an Employment Contract Ends
    reference: Article 42
    content: An employment contract may end for reasons specified by law, including
      written mutual agreement, expiry of the agreed term, lawful termination by
      either party and other statutory circumstances.
  - published: true
    id: termination-notice
    category: Employment Ending
    search: termination notice resignation notice period 30 90 days contract ending
    title: Termination Notice
    reference: Article 43
    content: Either party may terminate the contract for a legitimate reason by
      giving written notice. The agreed notice period must generally be at least
      30 days and no more than 90 days, with compensation rules applying where
      notice is not observed.
  - published: true
    id: dismissal-without-notice
    category: Employment Ending
    search: dismissal without notice misconduct termination investigation immediate
      dismissal
    title: Dismissal Without Notice
    reference: Article 44
    content: An employer may dismiss a worker without notice only in the specific
      serious cases listed by law and after following the required investigation
      and written-decision procedures.
  - published: true
    id: worker-leaving-without-notice
    category: Employment Ending
    search: employee leave without notice quit resignation employer breach assault
      harassment danger
    title: Worker Leaving Without Notice
    reference: Article 45
    content: A worker may leave employment without notice while retaining statutory
      rights in specific cases prescribed by law, including certain serious
      employer breaches, assault or harassment, grave workplace danger or
      fundamentally different work assigned without the required consent.
  - published: true
    id: termination-medical-unfitness
    category: Employment Ending
    search: medical unfitness sick leave termination health fitness illness dismissal
    title: Termination & Medical Unfitness
    reference: Article 46
    content: An employer may not terminate a worker for lack of health fitness
      before the worker has exhausted the sick leave legally available to them.
  - published: true
    id: unlawful-termination
    category: Employment Ending
    search: unlawful termination complaint mohre court case retaliation compensation
      dismissal
    title: Unlawful Termination
    reference: Article 47
    content: Employer termination is unlawful where it results from a worker
      submitting a serious complaint to the Ministry or filing a case against
      the employer that is proven valid. The competent court may award
      compensation subject to the statutory limit.
  - published: true
    id: continuity-employment-contracts
    category: Employment Ending
    search: continuity employment contracts business transfer new employer
      establishment change
    title: Continuity of Employment Contracts
    reference: Article 48
    content: Employment contracts remain effective where the establishment changes
      its legal form or status, and the new employer becomes responsible for
      implementing those contracts and the applicable legal obligations.
  - published: true
    id: unlawful-absence
    category: Employment Ending
    search: unlawful absence leave work without reason work permit one year foreign
      worker
    title: Unlawful Absence from Work
    reference: Article 50
    content: A foreign worker who leaves work for an illegitimate reason before the
      contract ends may, subject to the law, Executive Regulation and applicable
      exemptions, face a one-year restriction on obtaining another UAE work
      permit.
  - id: end-of-service-gratuity
    category: Employment Ending
    search: eosb gratuity 21 30 end-of-service gratuity
    title: End-of-Service Gratuity
    reference: Article 51
    content: "A foreign full-time worker completing at least one year of continuous
      service is entitled to gratuity based on last basic wage: 21 days per year
      for the first five years and 30 days thereafter. Unpaid absence is
      excluded; the total gratuity is capped at two years' wage."
    published: true
  - id: final-entitlements
    category: Employment Ending
    search: final settlement 14 days final entitlements
    title: Final Entitlements
    reference: Article 53
    content: The employer must pay wages and other statutory entitlements within 14
      days from the end of the contract.
    published: true
