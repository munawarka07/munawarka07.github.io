    label: Munawar.in بالعربية
    title_pre: معرفة عملية
    title_hl: للموارد البشرية
    title_post: في الإمارات
    intro: دليل عملي لقانون العمل الإماراتي والرواتب والتوطين، مع حاسبات ونماذج وأدوات جاهزة لفرق الموارد البشرية والموظفين.
    note: الصفحات التفصيلية باللغة الإنجليزية. هذه الصفحة دليلك السريع، ويمكنك قراءة أي صفحة بلغتك عبر ترجمة Google.
    btn_hub: ابدأ من مركز الموارد البشرية
    btn_translate: افتح الموقع بالعربية
    what_label: ماذا ستجد هنا
    what_title: كل ما تحتاجه في مكان واحد
    read_more: اقرأ المزيد
    cards:
    - ["قانون العمل الإماراتي", "الحقوق والإجازات وفترة التجربة وساعات العمل وإنهاء الخدمة ومكافأة نهاية الخدمة."]
    - ["أسئلة وأجوبة قانون العمل", "إجابات واضحة وسريعة عن أكثر أسئلة العمل شيوعاً في القطاع الخاص."]
    - ["مستجدات قانون العمل", "سجل مؤرخ لأحدث التغييرات في قانون العمل والرواتب والتوطين، مع خطوات عملية."]
    - ["الرواتب ونظام حماية الأجور", "ضوابط الرواتب والاستقطاعات والتسويات ومتطلبات نظام حماية الأجور."]
    - ["رؤى التوطين", "إرشادات عملية حول أهداف التوطين وتطوير الكفاءات الإماراتية."]
    - ["الحاسبات", "احسب الراتب النسبي ومكافأة نهاية الخدمة وبدل الإجازة، ونزّل النتيجة بصيغة PDF."]
    - ["مركز المستندات", "نماذج ورسائل وقوائم تحقق جاهزة لفرق الموارد البشرية."]
    - ["مركز الذكاء الاصطناعي", "أدوات ذكاء اصطناعي مفيدة واختبار تقييم ذاتي لمهارات الموارد البشرية يزداد صعوبة تدريجياً."]
    news_label: أهم المستجدات
    news_title: تغييرات يجب أن تعرفها
    facts:
    - ["١ يونيو ٢٠٢٦", "نظام حماية الأجور", "تستحق أجور كل شهر في اليوم الأول من الشهر التالي، ويجب دفع ٨٥٪ على الأقل من الأجور المستحقة في موعدها."]
    - ["٢٠٢٦", "التوطين", "على الشركات التي يعمل لديها ٥٠ موظفاً أو أكثر زيادة نسبة المواطنين في الوظائف المهارية بنسبة ٢٪ سنوياً، بواقع ١٪ لكل نصف سنة."]
    - ["٣١ أغسطس ٢٠٢٤", "المطالبات العمالية", "أصبحت مدة رفع المطالبة العمالية سنتين من تاريخ انتهاء العمل بدلاً من سنة واحدة."]
    disclaimer: ملخصات عامة لأغراض التوعية فقط. تحقق دائماً من الإرشادات الرسمية لوزارة الموارد البشرية والتوطين قبل اتخاذ أي قرار.
    details_link: التفاصيل والمصادر (بالإنجليزية)
    cta_title: هل لديك سؤال أو فكرة تعاون؟
    cta_text: يسعدني التواصل مع المهتمين بالموارد البشرية والرواتب وتطوير العمليات.
    cta_btn: تواصل معي
    chips: [قانون العمل, الرواتب, التوطين, الحاسبات]
