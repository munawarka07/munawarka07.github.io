questions:
  - published: true
    id: work-permit-required-uae
    category: Recruitment & Work Permits
    question: Is a work permit required to work in the UAE private sector?
    search: UAE work permit MOHRE employment permit work legally UAE
    answer: "Yes. A worker must have the appropriate work permit before legally
      working for a private-sector employer, subject to applicable permit rules.
      "
  - published: true
    id: who-pays-recruitment-costs-uae
    category: Recruitment & Work Permits
    question: Who pays recruitment and employment costs in the UAE?
    answer: The employer must bear recruitment and employment costs and may not
      charge these costs to the worker directly or indirectly.
    search: UAE recruitment fees visa costs employer employee recruitment cost
  - published: true
    id: can-employer-charge-recruitment-fees
    category: Recruitment & Work Permits
    question: Can an employer recover recruitment fees from an employee?
    answer: No. Recruitment and employment costs may not be charged to the worker
      directly or indirectly.
    search: recruitment fee deduction employee UAE visa cost recruitment costs
  - published: true
    id: recruitment-agency-licence-uae
    category: Recruitment & Work Permits
    question: Can anyone provide recruitment or employment mediation services in the UAE?
    answer: No. Recruitment and employment mediation activities require the
      appropriate licence from the Ministry or competent authority.
    search: UAE recruitment agency licence employment agency MOHRE
  - published: true
    id: work-for-another-employer-uae
    category: Recruitment & Work Permits
    question: Can an employee work for another employer in the UAE?
    answer: Only where the applicable work-permit and employment requirements are
      satisfied. An employee should not work for another employer without the
      required authorisation.
    search: second job UAE another employer part time permit MOHRE
  - published: true
    id: employment-contract-required-uae
    category: Employment Contracts
    question: Is an employment contract required in the UAE private sector?
    answer: Yes. The employer and worker must enter into an employment contract in
      accordance with the prescribed legal and regulatory requirements.
    search: UAE employment contract required MOHRE labour contract
  - published: true
    id: fixed-term-contract-uae
    category: Employment Contracts
    question: What type of employment contract is used in the UAE private sector?
    answer: UAE private-sector employment uses fixed-term employment contracts in
      accordance with the Labour Law and its implementing rules.
    search: UAE fixed term contract limited contract employment contract
  - published: true
    id: renew-employment-contract-uae
    category: Employment Contracts
    question: Can a UAE employment contract be renewed?
    answer: Yes. A fixed-term employment contract may be renewed or extended by
      agreement between the employer and worker.
    search: UAE contract renewal employment contract extension
  - published: true
    id: continue-working-after-contract-expiry
    category: Employment Contracts
    question: What happens if an employee continues working after the contract expires?
    answer: If both parties continue implementing the contract after expiry without
      an express new agreement, the original contract may be treated as
      implicitly extended under the applicable legal rules.
    search: expired employment contract continue working UAE renewal
  - published: true
    id: renewal-continuous-service-uae
    category: Employment Contracts
    question: Does contract renewal affect continuous service?
    answer: Generally, renewal or extension does not reset the employment
      relationship. The relevant periods are included in continuous service for
      applicable statutory entitlements.
    search: continuous service UAE contract renewal gratuity service
  - published: true
    id: better-benefits-than-labour-law
    category: Employment Contracts
    question: Can an employment contract provide better benefits than UAE Labour Law?
    answer: Yes. An employment contract or company policy may provide benefits more
      favourable to the employee than the statutory minimum.
    search: UAE labour law better benefits company policy contract
  - published: true
    id: maximum-probation-period-uae
    category: Probation
    question: What is the maximum probation period in the UAE?
    answer: Probation may not exceed six months, and the same employer may not place
      the same worker on probation more than once.
    search: UAE probation 6 months maximum probation
  - published: true
    id: non-compete-clause-uae
    category: Non-Compete
    question: When can a non-compete clause be used in the UAE?
    answer: A non-compete clause may be agreed where the worker's role gives access
      to the employer's clients or business secrets and a restriction is
      necessary to protect legitimate business interests.
    search: UAE non compete clause clients business secrets
