<section class="smart-related" aria-labelledby="smartRelatedTitle"><div class="shell"><div class="smart-related-head"><div><span>KEEP EXPLORING</span><h2 id="smartRelatedTitle">Related pages</h2></div><a href="/articles/">Browse all articles →</a></div><div class="smart-related-grid" id="smartRelatedGrid"></div></div></section>
<style id="munawar-related-v4">.smart-related{padding:58px 0 66px;background:linear-gradient(180deg,#f7fbff,#eef7ff);border-top:1px solid var(--line)}.smart-related-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.smart-related-head span{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--blue)}.smart-related-head h2{margin:7px 0 0;font-size:clamp(30px,4vw,48px);letter-spacing:-.04em}.smart-related-head>a{font-size:13px;font-weight:700;color:var(--blue)}.smart-related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.smart-related-card{display:block;padding:20px;border-radius:18px;background:#fff;border:1px solid var(--line);transition:.22s;min-height:125px}.smart-related-card:hover{transform:translateY(-4px);box-shadow:0 18px 50px rgba(23,77,140,.10);border-color:rgba(28,95,212,.18)}.smart-related-card small{display:block;color:var(--blue);font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.smart-related-card strong{display:block;margin:9px 0 5px;color:var(--navy);font-size:17px}.smart-related-card p{margin:0!important;color:var(--muted)!important;font-size:13px!important;line-height:1.5!important}@media(max-width:820px){.smart-related{padding:44px 0 50px}.smart-related-grid{grid-template-columns:1fr}.smart-related-head{align-items:flex-start;flex-direction:column}.smart-related-card{min-height:0}}</style>
<script id="munawar-related-v4-js">(function(){const path=location.pathname.replace(/\.html$/,'/');const pages={about:['/experience-education/','/skills-expertise/','/projects-awards/'],profile:['/about/','/skills-expertise/','/career-hub/'],hr:['/hr-hub/uae-labour-law/','/hr-hub/payroll-insights/','/hr-hub/hr-process-guide/'],law:['/hr-hub/labour-law-qa/','/hr-hub/calculator/','/articles/'],payroll:['/hr-hub/calculator/','/hr-hub/hr-process-guide/','/articles/'],process:['/hr-hub/library/','/hr-hub/hr-insights/','/hr-hub/payroll-insights/'],insights:['/hr-hub/hr-process-guide/','/hr-hub/emirati-insights/','/articles/'],emirati:['/hr-hub/hr-insights/','/hr-hub/uae-labour-law/','/articles/'],calculator:['/hr-hub/payroll-insights/','/hr-hub/uae-labour-law/','/hr-hub/library/'],library:['/hr-hub/hr-process-guide/','/hr-hub/ai-hub/','/hr-hub/'],ai:['/hr-hub/','/hr-hub/calculator/','/career-hub/'],career:['/skills-expertise/','/articles/','/contact/'],articles:['/hr-hub/','/hr-hub/payroll-insights/','/hr-hub/ai-hub/'],home:['/hr-hub/','/hr-hub/ai-hub/','/articles/']};const meta={'/about/':['About','Profile','Professional story and approach.'],'/experience-education/':['Experience & Education','About','Career journey and education.'],'/skills-expertise/':['Skills & Expertise','About','Core HR, payroll and operational capabilities.'],'/projects-awards/':['Projects & Awards','About','Selected projects, impact and recognition.'],'/hr-hub/':['HR Hub','Knowledge','UAE HR knowledge, tools and resources.'],'/hr-hub/uae-labour-law/':['UAE Labour Law','HR Hub','Practical UAE employment law guidance.'],'/hr-hub/labour-law-qa/':['Labour Law Q&A','HR Hub','Quick answers to common employment questions.'],'/hr-hub/payroll-insights/':['Payroll Insights','HR Hub','Payroll controls, compliance and practice.'],'/hr-hub/hr-process-guide/':['HR Process Guide','HR Hub','Step-by-step HR workflows.'],'/hr-hub/hr-insights/':['HR Insights','HR Hub','Practical people operations guidance.'],'/hr-hub/emirati-insights/':['Emirati Insights','HR Hub','Emiratisation and UAE workforce topics.'],'/hr-hub/calculator/':['HR Calculators','Tool','Payroll, EOSB and leave calculators.'],'/hr-hub/library/':['HR Library','Resource','Letters, forms and downloadable templates.'],'/hr-hub/ai-hub/':['AI Hub','AI Tools','AI-powered HR assistance and utilities.'],'/career-hub/':['Career Hub','Career','Career resources and opportunities.'],'/articles/':['Articles','Knowledge','Practical UAE HR articles and explainers.'],'/contact/':['Contact','Connect','Get in touch with Munawar.']};let key='home';if(path==='/about/')key='about';else if(['/experience-education/','/skills-expertise/','/projects-awards/'].includes(path))key='profile';else if(path==='/hr-hub/')key='hr';else if(path.includes('uae-labour-law')||path.includes('labour-law-qa'))key='law';else if(path.includes('payroll-insights'))key='payroll';else if(path.includes('hr-process-guide'))key='process';else if(path.includes('hr-insights'))key='insights';else if(path.includes('emirati-insights'))key='emirati';else if(path.includes('calculator'))key='calculator';else if(path.includes('library'))key='library';else if(path.includes('ai-hub'))key='ai';else if(path.includes('career-hub'))key='career';else if(path.startsWith('/articles/')||document.body.classList.contains('article-page'))key='articles';const grid=document.getElementById('smartRelatedGrid');if(!grid)return;grid.innerHTML=(pages[key]||pages.home).filter(u=>u!==path).slice(0,3).map(u=>{const m=meta[u];return '<a class="smart-related-card" href="'+u+'"><small>'+m[1]+'</small><strong>'+m[0]+'</strong><p>'+m[2]+'</p></a>'}).join('')})();</script>
{% endunless %}
