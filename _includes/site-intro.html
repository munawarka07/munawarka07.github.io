<!-- Opening animation: homepage, first visit per browser session only.
     Skipped for reduced-motion users and crawlers. Click, tap, scroll or any key skips it. -->
<style id="munawar-intro">
#mi-intro{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;overflow:hidden;color:#eaf4ff;
  background:radial-gradient(60vmax 60vmax at 50% 42%,rgba(28,95,212,.38),transparent 60%),radial-gradient(40vmax 40vmax at 82% 88%,rgba(54,200,223,.20),transparent 62%),radial-gradient(36vmax 36vmax at 12% 12%,rgba(78,143,255,.16),transparent 60%),#061226;
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;cursor:pointer;
  will-change:transform,border-radius;transform:translate3d(0,0,0)}
#mi-intro:before{content:"";position:absolute;inset:-2px;pointer-events:none;opacity:0;
  background-image:linear-gradient(rgba(140,190,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(140,190,255,.07) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(closest-side at 50% 45%,#000,transparent);mask-image:radial-gradient(closest-side at 50% 45%,#000,transparent);
  animation:mi-fade .9s .1s ease forwards}
#mi-intro .mi-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:42px;transition:transform .7s cubic-bezier(.65,0,.35,1),opacity .5s ease,filter .6s ease}
#mi-intro .mi-mark{position:relative;width:118px;height:118px;display:grid;place-items:center}
#mi-intro .mi-tile{position:absolute;inset:0;border-radius:32px;background:linear-gradient(135deg,#1c5fd4 0%,#4e8fff 55%,#36c8df 100%);overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 24px 70px rgba(28,95,212,.55),0 0 120px rgba(54,200,223,.25);
  opacity:0;transform:scale(.35) rotate(-14deg);animation:mi-tile .95s cubic-bezier(.34,1.56,.64,1) .15s forwards}
#mi-intro .mi-tile:after{content:"";position:absolute;top:-20%;bottom:-20%;width:46%;left:-70%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:mi-shine .9s cubic-bezier(.4,0,.2,1) .95s forwards}
#mi-intro .mi-logo{position:relative;width:68%;height:68%;object-fit:contain;opacity:0;filter:blur(10px);transform:scale(1.25);
  animation:mi-logo .8s cubic-bezier(.16,1,.3,1) .5s forwards}
#mi-intro .mi-ring{position:absolute;inset:-22px;width:calc(100% + 44px);height:calc(100% + 44px);overflow:visible;transform:rotate(-90deg)}
#mi-intro .mi-ring rect{fill:none;stroke:url(#mi-grad);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:640;stroke-dashoffset:640;animation:mi-draw 1.3s cubic-bezier(.65,0,.35,1) .35s forwards}
#mi-intro .mi-pulse{position:absolute;inset:0;border-radius:32px;border:1px solid rgba(120,210,255,.6);opacity:0;animation:mi-pulse 1.4s cubic-bezier(.16,1,.3,1) 1.05s}
#mi-intro .mi-word{display:flex;align-items:baseline;font-weight:800;font-size:clamp(30px,5.4vw,54px);letter-spacing:.14em;line-height:1;padding-left:.14em}
#mi-intro .mi-word span{display:inline-block;opacity:0;transform:translateY(.65em);filter:blur(6px);animation:mi-rise .7s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(.8s + var(--i)*.055s)}
#mi-intro .mi-word .mi-dot{background:linear-gradient(90deg,#4e8fff,#36c8df);-webkit-background-clip:text;background-clip:text;color:transparent}
#mi-intro .mi-tag{display:flex;flex-direction:column;align-items:center;gap:14px;font-size:clamp(12px,1.5vw,14px);font-weight:600;--ls:.42em;letter-spacing:var(--ls);text-transform:uppercase;color:rgba(214,232,255,.78);padding-left:var(--ls);opacity:0;animation:mi-tag 1s cubic-bezier(.16,1,.3,1) 1.3s forwards}
#mi-intro .mi-line{width:min(220px,50vw);height:2px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.08)}
#mi-intro .mi-line i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#1c5fd4,#36c8df);animation:mi-load 1.1s cubic-bezier(.65,0,.35,1) 1.35s forwards}
#mi-intro .mi-skip{position:absolute;right:22px;bottom:20px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(214,232,255,.45);opacity:0;animation:mi-fade .6s 1.2s forwards}
/* Exit: brand recedes, then the curtain lifts with a soft curved edge */
#mi-intro.mi-out .mi-stage{transform:translateY(-36px) scale(.94);opacity:0;filter:blur(6px)}
#mi-intro.mi-out{animation:mi-lift .95s cubic-bezier(.76,0,.24,1) .18s forwards}
#mi-intro.mi-out *{animation-play-state:paused}
@keyframes mi-fade{to{opacity:1}}
@keyframes mi-tile{to{opacity:1;transform:none}}
@keyframes mi-shine{to{left:130%}}
@keyframes mi-logo{to{opacity:1;filter:none;transform:none}}
@keyframes mi-draw{to{stroke-dashoffset:0}}
@keyframes mi-pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@keyframes mi-rise{to{opacity:1;transform:none;filter:none}}
@keyframes mi-tag{from{opacity:0;letter-spacing:calc(var(--ls) * 1.7)}to{opacity:1;letter-spacing:var(--ls)}}
@keyframes mi-load{to{transform:scaleX(1)}}
@keyframes mi-lift{0%{transform:translate3d(0,0,0);border-radius:0}40%{border-radius:0 0 50% 50%/0 0 9vh 9vh}100%{transform:translate3d(0,-112%,0);border-radius:0 0 50% 50%/0 0 16vh 16vh}}
@keyframes mi-guard{to{visibility:hidden;opacity:0;pointer-events:none}}
/* Safety net: if scripts stall, the overlay still clears itself */
#mi-intro{animation:mi-guard .01s 6s forwards}
/* Page entrance once the curtain lifts */
html.mi-intro body>.site-header,html.mi-intro body>main{opacity:0;transform:translate3d(0,34px,0) scale(.985)}
html.mi-intro body>.site-header{transform:translate3d(0,-18px,0)}
html.mi-intro.mi-reveal body>.site-header,html.mi-intro.mi-reveal body>main{opacity:1;transform:none;transition:opacity .9s ease .25s,transform 1.15s cubic-bezier(.16,1,.3,1) .2s}
html.mi-intro.mi-reveal body>.site-header{transition-delay:.55s}
html.mi-intro body{overflow:hidden}
html.mi-intro.mi-reveal body{overflow:auto}
@media (max-width:520px){#mi-intro .mi-tag{--ls:.24em}#mi-intro .mi-mark{width:104px;height:104px}#mi-intro .mi-skip{right:18px;bottom:16px}}
@media (prefers-reduced-motion:reduce){#mi-intro{display:none!important}html.mi-intro body>.site-header,html.mi-intro body>main{opacity:1!important;transform:none!important}}
</style>
<script id="munawar-intro-js">
(function(){

  try{ss=window.sessionStorage;}catch(e){return;}
  var isHome=location.pathname==='/'||location.pathname==='/index.html';

  letters+='<span class="mi-dot" style="--i:'+(word.length+.6)+'">.IN</span>';
  el.innerHTML='<div class="mi-stage"><div class="mi-mark"><svg class="mi-ring" viewBox="0 0 162 162"><defs><linearGradient id="mi-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36c8df"/><stop offset="1" stop-color="#4e8fff" stop-opacity=".15"/></linearGradient></defs><rect x="1" y="1" width="160" height="160" rx="46"/></svg><div class="mi-tile"></div><div class="mi-pulse"></div><img class="mi-logo" src="/assets/images/munawar-logo-256.webp" alt="" decoding="async"></div><div class="mi-word">'+letters+'</div><div class="mi-tag">People-First. Process-Driven.<span class="mi-line"><i></i></span></div></div><div class="mi-skip">Skip</div>';
  h.appendChild(el);
  var done=false,timers=[];
  function finish(){
    if(done)return;done=true;
    timers.forEach(clearTimeout);
    el.classList.add('mi-out');
    setTimeout(function(){h.classList.add('mi-reveal');},380);
    setTimeout(function(){
      if(el.parentNode)el.parentNode.removeChild(el);
      ['click','keydown','wheel','touchstart'].forEach(function(t){window.removeEventListener(t,finish,true);});
    },1250);
    setTimeout(function(){h.classList.remove('mi-intro','mi-reveal');},2600);
  }
  timers.push(setTimeout(finish,2700));
  timers.push(setTimeout(finish,5200)); /* hard stop */
  ['click','keydown','wheel','touchstart'].forEach(function(t){window.addEventListener(t,finish,{capture:true,passive:true});});
})();
</script>
