  reset_button: Reset
  result_label: ESTIMATED EOSB
  eligible_service_label: Eligible Service
  first_five_label: First 5 Years
  above_five_label: Above 5 Years
  note: 'Uses Article 51 assumptions for an eligible foreign full-time worker: at least one year continuous service, last
    basic wage, 21 days/year for first five years, 30 days/year thereafter, unpaid absence excluded, and statutory two-year
    wage cap.'
leave:
  tab: Leave
  label: LEAVE VALUE ESTIMATOR
  title: Leave balance value
  salary_label: Salary Basis (AED)
  balance_label: Leave Balance Days
  calculate_button: Calculate
  reset_button: Reset
  result_label: SIMPLE DAILY-RATE VALUE
  daily_rate_label: Daily Rate
  balance_days_label: Balance Days
  formula_label: Formula
  formula_text: Salary ÷ 30 × days
  note: This tool intentionally uses a simple 30-day daily-rate estimate. The legally correct wage basis can differ depending
    on whether the calculation is leave pay, encashment during employment, or settlement on termination.
