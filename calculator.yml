  label: STANDARD STATUTORY EOSB ESTIMATOR
  title: End-of-service gratuity
  start_date_label: Start Date
  end_date_label: End Date
  basic_salary_label: Last Basic Salary (AED)
  unpaid_days_label: Unpaid Absence Days
